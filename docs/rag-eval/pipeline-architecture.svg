<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #09090b);" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="900px" height="720px" viewBox="0 0 900 720">
  <defs/>
  <rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(#ffffff, #09090b);"/>
  <g>
    <!-- Title -->
    <g transform="translate(0.5,0.5)">
      <text x="450" y="35" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14px" font-weight="700" text-anchor="middle" style="fill: light-dark(#0f172a, #f8fafc);">Evaluation Pipeline</text>
    </g>

    <!-- Node 1: Evaluation Dataset -->
    <g transform="translate(310,75)">
      <rect x="0" y="0" width="280" height="75" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" style="fill: light-dark(#f8fafc, #1e293b); stroke: light-dark(#cbd5e1, #475569);"/>
      <text x="140" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#0f172a, #f8fafc);">Evaluation Dataset</text>
      <text x="140" y="40" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#64748b, #94a3b8);">[TypeScript Dataset]</text>
      <text x="140" y="58" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Pre-defined positive, negative, and control queries.</text>
    </g>

    <!-- Edge 1: Dataset -> Runner -->
    <g transform="translate(0.5,0.5)">
      <path d="M 450 150 L 450 203" fill="none" stroke="#64748b" stroke-width="1.2" stroke-miterlimit="10" style="stroke: light-dark(#64748b, #94a3b8);"/>
      <path d="M 450 209 L 446.5 201 L 450 203 L 453.5 201 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" style="fill: light-dark(#64748b, #94a3b8); stroke: light-dark(#64748b, #94a3b8);"/>
      <rect fill="#ffffff" x="400" y="167" width="100" height="24" rx="3" ry="3" style="fill: light-dark(#ffffff, #09090b);"/>
      <text x="450" y="177" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Loads test queries</text>
      <text x="450" y="188" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle" style="fill: light-dark(#94a3b8, #64748b);">[In-memory]</text>
    </g>

    <!-- Node 2: Evaluation Runner (Accent Blue) -->
    <g transform="translate(310,210)">
      <rect x="0" y="0" width="280" height="80" rx="6" ry="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" style="fill: light-dark(#eff6ff, #172554); stroke: light-dark(#3b82f6, #60a5fa);"/>
      <text x="140" y="24" fill="#1e3a8a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#1e3a8a, #dbeafe);">Evaluation Runner</text>
      <text x="140" y="40" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#2563eb, #93c5fd);">[Node.js Engine]</text>
      <text x="140" y="60" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#1e40af, #bfdbfe);">Executes retrieval runs, measures timing, and logs metrics.</text>
    </g>

    <!-- Node 3: Cloudflare Workers AI (Subtle Cyan/Slate) -->
    <g transform="translate(20,355)">
      <rect x="0" y="0" width="260" height="80" rx="6" ry="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" style="fill: light-dark(#f8fafc, #1e293b); stroke: light-dark(#94a3b8, #64748b);"/>
      <text x="130" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#0f172a, #f8fafc);">Cloudflare Workers AI</text>
      <text x="130" y="40" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#64748b, #94a3b8);">[External REST API]</text>
      <text x="130" y="60" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Infers BGE-M3 (1024d) query vector embeddings.</text>
    </g>

    <!-- Edge 2: Runner -> Cloudflare -->
    <g transform="translate(0.5,0.5)">
      <path d="M 310 270 L 150 270 L 150 348" fill="none" stroke="#64748b" stroke-width="1.2" stroke-miterlimit="10" style="stroke: light-dark(#64748b, #94a3b8);"/>
      <path d="M 150 354 L 146.5 346 L 150 348 L 153.5 346 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" style="fill: light-dark(#64748b, #94a3b8); stroke: light-dark(#64748b, #94a3b8);"/>
      <rect fill="#ffffff" x="155" y="258" width="145" height="24" rx="3" ry="3" style="fill: light-dark(#ffffff, #09090b);"/>
      <text x="227" y="268" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Requests vector embeddings</text>
      <text x="227" y="279" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle" style="fill: light-dark(#94a3b8, #64748b);">[HTTPS / JSON]</text>
    </g>

    <!-- Node 4: Vector Database (Emerald Green Accent) -->
    <g transform="translate(620,350)">
      <path d="M 0 12 C 0 5 58 0 130 0 C 202 0 260 5 260 12 L 260 76 C 260 83 202 88 130 88 C 58 88 0 83 0 76 Z" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" style="fill: light-dark(#f0fdf4, #052e16); stroke: light-dark(#16a34a, #4ade80);"/>
      <path d="M 260 12 C 260 19 202 24 130 24 C 58 24 0 19 0 12" fill="none" stroke="#16a34a" stroke-width="1.5" style="stroke: light-dark(#16a34a, #4ade80);"/>
      <text x="130" y="42" fill="#14532d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#14532d, #dcfce7);">Vector Database</text>
      <text x="130" y="56" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#15803d, #86efac);">[PostgreSQL / pgvector]</text>
      <text x="130" y="73" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#166534, #bbf7d0);">2,487 chunks with HNSW index.</text>
    </g>

    <!-- Edge 3: Runner -> Database -->
    <g transform="translate(0.5,0.5)">
      <path d="M 590 270 L 750 270 L 750 343" fill="none" stroke="#64748b" stroke-width="1.2" stroke-miterlimit="10" style="stroke: light-dark(#64748b, #94a3b8);"/>
      <path d="M 750 349 L 746.5 341 L 750 343 L 753.5 341 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" style="fill: light-dark(#64748b, #94a3b8); stroke: light-dark(#64748b, #94a3b8);"/>
      <rect fill="#ffffff" x="600" y="258" width="145" height="24" rx="3" ry="3" style="fill: light-dark(#ffffff, #09090b);"/>
      <text x="672" y="268" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Queries nearest neighbors (&lt;=&gt;)</text>
      <text x="672" y="279" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle" style="fill: light-dark(#94a3b8, #64748b);">[libpq / TCP]</text>
    </g>

    <!-- Node 5: LLM Judge Gateway (Amber/Warm Accent) -->
    <g transform="translate(320,495)">
      <rect x="0" y="0" width="260" height="80" rx="6" ry="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="4 3" style="fill: light-dark(#fefce8, #422006); stroke: light-dark(#ca8a04, #facc15);"/>
      <text x="130" y="24" fill="#713f12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#713f12, #fef08a);">LLM Judge Gateway</text>
      <text x="130" y="40" fill="#a16207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#a16207, #fde047);">[External HTTP Service]</text>
      <text x="130" y="60" fill="#854d0e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#854d0e, #fef9c3);">Evaluates groundedness of retrieved passages.</text>
    </g>

    <!-- Edge 4: Runner -> Judge -->
    <g transform="translate(0.5,0.5)">
      <path d="M 450 290 L 450 488" fill="none" stroke="#64748b" stroke-width="1.2" stroke-miterlimit="10" style="stroke: light-dark(#64748b, #94a3b8);"/>
      <path d="M 450 494 L 446.5 486 L 450 488 L 453.5 486 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" style="fill: light-dark(#64748b, #94a3b8); stroke: light-dark(#64748b, #94a3b8);"/>
      <rect fill="#ffffff" x="382" y="380" width="136" height="24" rx="3" ry="3" style="fill: light-dark(#ffffff, #09090b);"/>
      <text x="450" y="390" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Evaluates retrieved passages</text>
      <text x="450" y="401" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle" style="fill: light-dark(#94a3b8, #64748b);">[HTTPS / JSON]</text>
    </g>

    <!-- Node 6: Benchmark Results File (Slate/Neutral) -->
    <g transform="translate(320,635)">
      <rect x="0" y="0" width="260" height="75" rx="6" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" style="fill: light-dark(#f8fafc, #1e293b); stroke: light-dark(#cbd5e1, #475569);"/>
      <text x="130" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12px" font-weight="600" text-anchor="middle" style="fill: light-dark(#0f172a, #f8fafc);">Benchmark Results File</text>
      <text x="130" y="40" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#64748b, #94a3b8);">[JSON Storage]</text>
      <text x="130" y="58" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Persists query rankings, distances, and latencies.</text>
    </g>

    <!-- Edge 5: Judge -> Artifact -->
    <g transform="translate(0.5,0.5)">
      <path d="M 450 575 L 450 628" fill="none" stroke="#64748b" stroke-width="1.2" stroke-miterlimit="10" style="stroke: light-dark(#64748b, #94a3b8);"/>
      <path d="M 450 634 L 446.5 626 L 450 628 L 453.5 626 Z" fill="#64748b" stroke="#64748b" stroke-width="1.2" style="fill: light-dark(#64748b, #94a3b8); stroke: light-dark(#64748b, #94a3b8);"/>
      <rect fill="#ffffff" x="390" y="593" width="120" height="24" rx="3" ry="3" style="fill: light-dark(#ffffff, #09090b);"/>
      <text x="450" y="603" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10px" text-anchor="middle" style="fill: light-dark(#475569, #cbd5e1);">Writes execution log</text>
      <text x="450" y="614" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9px" text-anchor="middle" style="fill: light-dark(#94a3b8, #64748b);">[File I/O]</text>
    </g>
  </g>
</svg>